name: Release

# `workflow_run` always runs this file from the default branch, whatever branch's CI
# completed. So releases for the `v0` maintenance branch are driven from `main`'s copy
# of this file, and every step below must act on the branch whose CI run finished
# rather than on the default branch it was loaded from.
on:
  workflow_run:
    workflows: ['CI']
    branches: [main, v0]
    types: [completed]

jobs:
  release:
    permissions:
      id-token: write # Required for trusted publishing
      contents: write
      pull-requests: write

    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.repository_owner == 'cloudflare' }}
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.workflow_run.head_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - id: changesets
        uses: changesets/action@v1
        with:
          branch: ${{ github.event.workflow_run.head_branch }}
          version: ./.github/changeset-version.sh
          publish: ./.github/changeset-publish.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
