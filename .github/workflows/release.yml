name: Release

# The 0.x maintenance branch releases on push. main releases from a `workflow_run` after
# CI, but that event always executes the default branch's copy of the workflow with the
# default branch's `github.sha`, and changesets/action bases its Version Packages branch
# and its tags on that sha. A v0 release therefore has to be triggered by a push to v0
# itself, and it repeats CI's checks so that nothing untested is released.
on:
  push:
    branches: [v0]

# `npm publish` moves `latest` unless told otherwise. Never let a v0 publish interleave
# with one from main; the group is shared with main's release.yml.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  release:
    permissions:
      id-token: write # Required for trusted publishing
      contents: write
      pull-requests: write

    if: ${{ github.repository_owner == 'cloudflare' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npx prettier --check .

      - id: changesets
        uses: changesets/action@v1
        with:
          version: ./.github/changeset-version.sh
          publish: ./.github/changeset-publish.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
